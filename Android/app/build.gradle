plugins { id 'com.android.application' }
android {
 namespace 'it.battv'
 compileSdk 36
 defaultConfig { applicationId 'it.battv.app'; minSdk 26; targetSdk 35; versionCode (project.findProperty('buildNumber') ?: '1').toInteger(); versionName "1.0.${project.findProperty('buildNumber') ?: '1'}" }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.github.pedroSG94.RootEncoder:library:2.6.4' }
