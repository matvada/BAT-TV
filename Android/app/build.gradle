plugins { id 'com.android.application' }
android {
 namespace 'it.battv'
 compileSdk 36
 defaultConfig { applicationId 'it.battv.app'; minSdk 26; targetSdk 35; versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1'); versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}" }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.github.pedroSG94.RootEncoder:library:2.6.4' }
