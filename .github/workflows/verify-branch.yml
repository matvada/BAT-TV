name: BAT tv · verifica iPhone e Android

on:
  pull_request:
    branches: [main]
    paths:
      - 'iPhone/**'
      - 'Android/**'
      - '.github/workflows/verify-branch.yml'

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Compila iPhone senza firma
        run: |
          xcodebuild -project 'iPhone/BAT-tv.xcodeproj' \
            -scheme 'BAT tv' -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BATDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verifica grafica ufficiale e migrazione partita
        run: tests/render-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BAT-native-render-check
          path: native-render-check/*.png
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepara Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compila Android
        working-directory: Android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BAT-Android-native-render-check
          path: Android/app/build/native-render-check/*.png
