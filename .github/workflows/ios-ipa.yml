name: BAT tv · IPA e APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iPhone/**'
      - 'Android/**'
      - 'scripts/update_altsource.py'
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

concurrency:
  group: bat-tv-publish
  cancel-in-progress: false

jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Imposta numero build
        run: |
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" 'iPhone/COURTSIDE/Info.plist'
          plutil -replace CFBundleShortVersionString -string "1.0.$GITHUB_RUN_NUMBER" 'iPhone/COURTSIDE/Info.plist'
      - name: Compila per iPhone senza firma
        run: |
          xcodebuild -project 'iPhone/BAT-tv.xcodeproj' \
            -scheme 'BAT tv' -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BATDerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
      - name: Prepara IPA per SideStore
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/BATDerivedData/Build/Products/Release-iphoneos/BAT tv.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/BAT-tv-SideStore.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/BAT-tv-SideStore.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: BAT-tv-iPhone
          path: BAT-tv-SideStore.ipa
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepara Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compila APK Android di prova
        working-directory: Android
        run: ./gradlew --no-daemon :app:assembleDebug -PbuildNumber="$GITHUB_RUN_NUMBER"
      - name: Prepara APK
        run: cp Android/app/build/outputs/apk/debug/app-debug.apk BAT-tv-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BAT-tv-Android
          path: BAT-tv-Android.apk
          if-no-files-found: error
  publish:
    needs: [iphone, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BAT-tv-iPhone
      - uses: actions/download-artifact@v4
        with:
          name: BAT-tv-Android
      - name: Pubblica entrambi nella stessa Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BAT-tv-SideStore.ipa BAT-tv-Android.apk --clobber
          else
            gh release create "$TAG" BAT-tv-SideStore.ipa BAT-tv-Android.apk \
              --target "$GITHUB_SHA" \
              --title "BAT tv · build ${GITHUB_RUN_NUMBER}" \
              --notes "IPA per SideStore e APK Android di prova."
          fi
          for file in BAT-tv-SideStore.ipa BAT-tv-Android.apk; do
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}" \
              -o "$RUNNER_TEMP/$file"
            cmp "$file" "$RUNNER_TEMP/$file"
          done
      - name: Aggiorna la sorgente SideStore
        run: |
          git pull --rebase origin main
          python3 scripts/update_altsource.py BAT-tv-SideStore.ipa "$GITHUB_RUN_NUMBER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add altstore.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna sorgente SideStore alla build ${GITHUB_RUN_NUMBER} [skip ci]"
            git push origin HEAD:main
          fi
